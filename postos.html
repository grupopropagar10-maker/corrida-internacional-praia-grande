<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Postos & Carrinhos — Corrida PG</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }
    .dot-ativo    { background: #28A745; }
    .dot-standby  { background: #FFC107; }
    .dot-inativo  { background: #DC3545; }

    .posto-card {
      background: rgba(255,255,255,0.95);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.4rem;
      transition: var(--transition);
      border-left: 5px solid var(--primary);
      border: 1px solid rgba(0, 61, 122, 0.10);
    }

    .posto-card.standby { border-left-color: #FFC107; }
    .posto-card.inativo { border-left-color: #DC3545; }

    .posto-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .posto-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 0.7rem;
    }

    .posto-nome {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .posto-km {
      font-size: 0.8rem;
      color: var(--gray);
      margin-top: 0.15rem;
    }

    .posto-local {
      font-size: 0.82rem;
      color: var(--gray);
      margin-bottom: 0.8rem;
      display: flex;
      align-items: flex-start;
      gap: 0.3rem;
    }

    .posto-meta {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }

    .meta-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--gray);
      font-weight: 600;
    }

    .meta-value {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .posto-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .filter-bar {
      display: flex;
      gap: 0.8rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 0.4rem 1rem;
      border-radius: 50px;
      border: 1px solid rgba(0, 61, 122, 0.14);
      background: rgba(255,255,255,0.86);
      font-size: 0.82rem;
      cursor: pointer;
      transition: var(--transition);
      font-weight: 600;
    }

    .filter-btn:hover,
    .filter-btn.active {
      border-color: var(--primary);
      color: var(--primary);
      background: #EEF4FB;
    }

    .search-input {
      flex: 1;
      min-width: 200px;
      max-width: 320px;
    }

    .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <a href="index.html" class="navbar-brand">
    <span class="logo-icon">🏃</span>
    <span>Corrida Internacional PG</span>
  </a>
  <button class="hamburger" aria-label="Menu">☰</button>
  <ul class="navbar-nav">
    <li><a href="index.html">🏠 Início</a></li>
    <li><a href="congregacoes.html">⛪ Congregações</a></li>
    <li><a href="postos.html">📍 Postos</a></li>
    <li><a href="distribuicao.html">📖 Distribuição</a></li>
    <li><a href="dashboard.html">📊 Dashboard</a></li>
  </ul>
</nav>

<!-- HEADER -->
<div class="page-header">
  <h1>📍 Postos & Carrinhos de Literatura</h1>
  <p>Gerencie os pontos de distribuição ao longo do percurso da corrida</p>
</div>

<!-- STATS RÁPIDAS -->
<section class="section" style="padding-bottom:0;">
  <div class="grid grid-4" id="stats-postos"></div>
</section>

<!-- FILTROS + BOTÃO NOVO -->
<section class="section" style="padding-top:1rem; padding-bottom:0;">
  <div class="card">
    <div class="flex-between flex-wrap gap-1">
      <div class="filter-bar">
        <input class="form-control search-input" id="search-posto" placeholder="🔍 Buscar posto..." type="text"/>
        <button class="filter-btn active" data-filter="todos">Todos</button>
        <button class="filter-btn" data-filter="ativo">✅ Ativos</button>
        <button class="filter-btn" data-filter="standby">⏳ Standby</button>
        <button class="filter-btn" data-filter="inativo">❌ Inativos</button>
      </div>
      <button class="btn btn-primary" id="btn-novo-posto">➕ Novo Posto</button>
    </div>
  </div>
</section>

<!-- LISTA DE POSTOS -->
<section class="section">
  <div class="grid grid-2" id="postos-grid"></div>
</section>

<!-- MODAL FORMULÁRIO -->
<div class="modal-overlay" id="modal-posto">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-titulo">➕ Novo Posto</h3>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <form id="form-posto">
      <input type="hidden" id="posto-id"/>
      <input type="hidden" id="posto-lat"/>
      <input type="hidden" id="posto-lng"/>
      <div class="form-group">
        <label>Categoria do evento</label>
        <select class="form-control" id="posto-categoria">
          <option value="">— Sem categoria —</option>
        </select>
      </div>
      <div class="grid grid-2">
        <div class="form-group">
          <label>Nome do Posto</label>
          <input class="form-control" id="posto-nome" placeholder="Ex: Posto 1 – Largada" required/>
        </div>
        <div class="form-group">
          <label>Km no percurso</label>
          <input class="form-control" id="posto-km" placeholder="Ex: 0" required/>
        </div>
      </div>
      <div class="form-group">
        <label>Endereço / Localização</label>
        <input class="form-control" id="posto-local" placeholder="Ex: Av. Pres. Kennedy, próx. ao quiosque 10" required/>
      </div>
      <div class="grid grid-2">
        <div class="form-group">
          <label>Responsável</label>
          <input class="form-control" id="posto-responsavel" placeholder="Nome do irmão/irmã" required/>
        </div>
        <div class="form-group">
          <label>Publicações disponíveis</label>
          <input class="form-control" type="number" id="posto-publicacoes" min="0" value="50"/>
        </div>
      </div>
      <div class="grid grid-2">
        <div class="form-group">
          <label>🛒 Cap. Carrinhos</label>
          <input class="form-control" type="number" id="posto-carrinhos" min="0" value="1"/>
        </div>
        <div class="form-group">
          <label>🪧 Cap. Displays</label>
          <input class="form-control" type="number" id="posto-displays" min="0" value="1"/>
        </div>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select class="form-control" id="posto-status">
          <option value="ativo">✅ Ativo</option>
          <option value="standby">⏳ Standby</option>
          <option value="inativo">❌ Inativo</option>
        </select>
      </div>
      <div class="form-group">
        <label>Observações</label>
        <textarea class="form-control" id="posto-obs" rows="2" placeholder="Informações adicionais..."></textarea>
      </div>
      <div class="flex gap-1" style="justify-content:flex-end; margin-top:0.5rem;">
        <button type="button" class="btn btn-outline" id="btn-cancelar">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-salvar">💾 Salvar Posto</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL CONFIRMAÇÃO -->
<div class="modal-overlay" id="modal-confirm">
  <div class="modal" style="max-width:380px; text-align:center;">
    <div style="font-size:3rem; margin-bottom:1rem;">🗑️</div>
    <h3 style="color:var(--danger); margin-bottom:0.5rem;">Remover Posto?</h3>
    <p style="color:var(--gray); margin-bottom:1.5rem; font-size:0.9rem;">Esta ação não pode ser desfeita.</p>
    <div class="flex gap-1" style="justify-content:center;">
      <button class="btn btn-outline" id="confirm-no">Cancelar</button>
      <button class="btn btn-danger" id="confirm-yes">Remover</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="js/firebase-db.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script>
  Auth.check('admin-only');
  let filtroAtual = 'todos';
  let deleteTarget = null;

  // ---- RENDER STATS ----
  function renderStats() {
    const postos = DB.get('postos');
    const ativos   = postos.filter(p => p.status === 'ativo').length;
    const standby  = postos.filter(p => p.status === 'standby').length;
    const inativos = postos.filter(p => p.status === 'inativo').length;
    const totalPub = postos.reduce((s, p) => s + (parseInt(p.publicacoes) || 0), 0);

    document.getElementById('stats-postos').innerHTML = `
      <div class="stat-card">
        <div class="stat-icon blue">📍</div>
        <div class="stat-info"><h3>${postos.length}</h3><p>Total de Postos</p></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green">✅</div>
        <div class="stat-info"><h3>${ativos}</h3><p>Ativos</p></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange">⏳</div>
        <div class="stat-info"><h3>${standby}</h3><p>Standby</p></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon purple">📖</div>
        <div class="stat-info"><h3>${totalPub}</h3><p>Publicações disp.</p></div>
      </div>
    `;
  }

  // ---- RENDER GRID ----
  function renderPostos() {
    const postos = DB.get('postos');
    const busca  = document.getElementById('search-posto').value.toLowerCase();

    const filtrado = postos.filter(p => {
      const matchFiltro = filtroAtual === 'todos' || p.status === filtroAtual;
      const matchBusca  = !busca || p.nome.toLowerCase().includes(busca) || p.responsavel.toLowerCase().includes(busca);
      return matchFiltro && matchBusca;
    });

    const grid = document.getElementById('postos-grid');

    if (!filtrado.length) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
        <div class="icon">📍</div>
        <h3>Nenhum posto encontrado</h3>
        <p>Tente outro filtro ou adicione um novo posto.</p>
      </div>`;
      return;
    }

    const badgeMap = {
      ativo:   '<span class="badge badge-ativo">● Ativo</span>',
      standby: '<span class="badge badge-standby">● Standby</span>',
      inativo: '<span class="badge badge-inativo">● Inativo</span>',
    };

    grid.innerHTML = filtrado.map(p => `
      <div class="posto-card ${p.status}">
        <div class="posto-top">
          <div>
            <div class="posto-nome">${p.nome}</div>
            <div class="posto-km">📏 Km ${p.km}</div>
          </div>
          ${badgeMap[p.status] || ''}
        </div>
        <div class="posto-local">📍 ${p.local}</div>
        <div class="posto-meta">
          <div class="meta-item">
            <span class="meta-label">Responsável</span>
            <span class="meta-value">👤 ${p.responsavel}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Publicações</span>
            <span class="meta-value">📖 ${p.publicacoes}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Contatos</span>
            <span class="meta-value">🤝 ${p.contatos || 0}</span>
          </div>
        </div>
        ${p.obs ? `<p style="font-size:0.8rem;color:var(--gray);margin-bottom:0.8rem;">💬 ${p.obs}</p>` : ''}
        <div class="posto-actions">
          <button class="btn btn-outline btn-sm" onclick="editarPosto(${p.id})">✏️ Editar</button>
          <button class="btn btn-sm" style="background:#EEF4FB;color:var(--primary);" onclick="ciclarStatus(${p.id})">🔄 Status</button>
          <button class="btn btn-danger btn-sm" onclick="confirmarDelete(${p.id})">🗑️</button>
        </div>
      </div>
    `).join('');
  }

  // ---- CICLAR STATUS ----
  function ciclarStatus(id) {
    const postos = DB.get('postos');
    const p = postos.find(x => x.id === id);
    if (!p) return;
    const ciclo = ['ativo', 'standby', 'inativo'];
    p.status = ciclo[(ciclo.indexOf(p.status) + 1) % 3];
    DB.set('postos', postos);
    renderPostos();
    renderStats();
    showToast(`Status alterado para "${p.status}"`, 'success');
  }

  // Helper: popula select de categorias
  function popularSelectCategoria(valorAtual = '') {
    const cats = DB.get('categorias', []);
    const sel  = document.getElementById('posto-categoria');
    sel.innerHTML = '<option value="">— Sem categoria —</option>' +
      cats.map(c => `<option value="${c.id}" ${c.id == valorAtual ? 'selected' : ''}>${c.nome}</option>`).join('');
  }

  // ---- ABRIR MODAL NOVO ----
  document.getElementById('btn-novo-posto').addEventListener('click', () => {
    document.getElementById('modal-titulo').textContent = '➕ Novo Posto';
    document.getElementById('btn-salvar').textContent = '💾 Salvar Posto';
    document.getElementById('form-posto').reset();
    document.getElementById('posto-id').value = '';
    popularSelectCategoria();
    document.getElementById('modal-posto').classList.add('open');
  });

  // ---- FECHAR MODAL ----
  function fecharModal() {
    document.getElementById('modal-posto').classList.remove('open');
  }
  document.getElementById('modal-close').addEventListener('click', fecharModal);
  document.getElementById('btn-cancelar').addEventListener('click', fecharModal);
  document.getElementById('modal-posto').addEventListener('click', e => {
    if (e.target === e.currentTarget) fecharModal();
  });

  // ---- EDITAR POSTO ----
  function editarPosto(id) {
    const postos = DB.get('postos');
    const p = postos.find(x => x.id === id);
    if (!p) return;
    document.getElementById('modal-titulo').textContent = '✏️ Editar Posto';
    document.getElementById('btn-salvar').textContent   = '💾 Atualizar';
    document.getElementById('posto-id').value           = p.id;
    document.getElementById('posto-lat').value          = p.lat  || '';
    document.getElementById('posto-lng').value          = p.lng  || '';
    document.getElementById('posto-nome').value         = p.nome;
    document.getElementById('posto-km').value           = p.km;
    document.getElementById('posto-local').value        = p.local;
    document.getElementById('posto-responsavel').value  = p.responsavel;
    document.getElementById('posto-publicacoes').value  = p.publicacoes;
    document.getElementById('posto-carrinhos').value    = p.capCarrinhos || 1;
    document.getElementById('posto-displays').value     = p.capDisplays  || 1;
    document.getElementById('posto-status').value       = p.status;
    document.getElementById('posto-obs').value          = p.obs || '';
    popularSelectCategoria(p.categoriaId || '');
    document.getElementById('modal-posto').classList.add('open');
    document.getElementById('modal-posto').classList.add('open');
  }

  // ---- SALVAR ----
  document.getElementById('form-posto').addEventListener('submit', e => {
    e.preventDefault();
    const postos = DB.get('postos');
    const id     = parseInt(document.getElementById('posto-id').value);

    const dados = {
      nome:         document.getElementById('posto-nome').value.trim(),
      km:           document.getElementById('posto-km').value.trim(),
      local:        document.getElementById('posto-local').value.trim(),
      responsavel:  document.getElementById('posto-responsavel').value.trim(),
      publicacoes:  parseInt(document.getElementById('posto-publicacoes').value) || 0,
      capCarrinhos: parseInt(document.getElementById('posto-carrinhos').value)  || 0,
      capDisplays:  parseInt(document.getElementById('posto-displays').value)   || 0,
      categoriaId:  parseInt(document.getElementById('posto-categoria').value)  || null,
      status:       document.getElementById('posto-status').value,
      obs:          document.getElementById('posto-obs').value.trim(),
      contatos:     0,
    };
    // Preserva coordenadas do mapa
    const _lat = parseFloat(document.getElementById('posto-lat').value);
    const _lng = parseFloat(document.getElementById('posto-lng').value);
    if (!isNaN(_lat) && !isNaN(_lng)) { dados.lat = _lat; dados.lng = _lng; }

    if (id) {
      const idx = postos.findIndex(p => p.id === id);
      if (idx >= 0) {
        dados.contatos = postos[idx].contatos || 0;
        postos[idx] = { ...postos[idx], ...dados };
        showToast('Posto atualizado com sucesso!', 'success');
      }
    } else {
      dados.id = Date.now();
      postos.push(dados);
      showToast('Novo posto cadastrado!', 'success');
    }

    DB.set('postos', postos);
    fecharModal();
    renderPostos();
    renderStats();
  });

  // ---- CONFIRMAR DELETE ----
  function confirmarDelete(id) {
    deleteTarget = id;
    document.getElementById('modal-confirm').classList.add('open');
  }

  document.getElementById('confirm-no').addEventListener('click', () => {
    document.getElementById('modal-confirm').classList.remove('open');
    deleteTarget = null;
  });

  document.getElementById('confirm-yes').addEventListener('click', () => {
    if (deleteTarget !== null) {
      const resumo = window.removePostosAndDependencies ? window.removePostosAndDependencies(deleteTarget) : { removedDesignacoes: 0 };
      showToast(resumo.removedDesignacoes ? 'Posto e designações vinculadas removidos.' : 'Posto removido.', 'info');
      renderPostos();
      renderStats();
      deleteTarget = null;
    }
    document.getElementById('modal-confirm').classList.remove('open');
  });

  // ---- FILTROS ----
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filtroAtual = btn.dataset.filter;
      renderPostos();
    });
  });

  document.getElementById('search-posto').addEventListener('input', renderPostos);

  // INIT
  renderStats();
  renderPostos();
</script>
</body>
</html>
